name: ohos-sdk-merge-validate

on:
  push:
    branches:
      - ci/sdk-merge12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: restore + build (12.0 dev line)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out sdk-ohos
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Build the SDK
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
        run: ./build.sh
