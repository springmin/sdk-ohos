name: OHOS release mirror (post-rename)

# Fork-local helper: mirrors the latest Shipping assets of a frozen pipeline
# release (the `-ohos` tags, which also feed the build) into the post-rename
# `-openharmony` distribution releases, from a fast GitHub runner.
# Version pins come from eng/ohos-install/versions.env; only the asset filter is
# per-run. Idempotent: assets are re-uploaded with --clobber and verified by sha256.

on:
  workflow_dispatch:
    inputs:
      asset_prefix:
        description: 'Mirror only assets updated at this ISO prefix (e.g. 2026-09-14T03:17); empty mirrors all'
        required: false
        default: ''

jobs:
  mirror:
    name: mirror ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: runtime-ohos
            band: runtime
          - repo: aspnetcore-ohos
            band: runtime
          - repo: sdk-ohos
            band: sdk
    env:
      GH_TOKEN: ${{ secrets.OHOS_RELEASE_TOKEN }}
      REPO: ${{ matrix.repo }}
      BAND: ${{ matrix.band }}
      ASSET_PREFIX: ${{ inputs.asset_prefix }}

    steps:
      - name: Load version pins
        run: |
          gh api "repos/${{ github.repository }}/contents/eng/ohos-install/versions.env" \
            -H "Accept: application/vnd.github.raw" > versions.env
          cat versions.env

      - name: Mirror the latest Shipping assets to the post-rename release
        run: |
          set -euo pipefail
          set -a
          . ./versions.env
          set +a
          case "$BAND" in
            runtime) VERSION="$RT_VERSION" ;;
            sdk) VERSION="$SDK_VERSION" ;;
            *) echo "unknown band: $BAND" >&2; exit 2 ;;
          esac
          SRC="v$VERSION-ohos"
          DST="v$VERSION-openharmony"
          OWNER="${{ github.repository_owner }}"
          echo "mirroring $OWNER/$REPO $SRC -> $DST (asset_prefix='$ASSET_PREFIX')"

          mkdir -p dl
          gh api "repos/$OWNER/$REPO/releases/tags/$SRC" \
            --jq ".assets[] | select(.updated_at | startswith(\"$ASSET_PREFIX\")) | [.name, (.size|tostring), (.digest // \"none\")] | @tsv" \
            > assets.tsv
          echo "assets to mirror: $(wc -l < assets.tsv)"
          while IFS=$'\t' read -r name size digest; do
            [ -n "$name" ] || continue
            echo "--- $name ($size bytes)"
            gh release download "$SRC" --repo "$OWNER/$REPO" --pattern "$name" --dir dl --clobber
            actual=$(stat -c %s "dl/$name")
            if [ "$actual" != "$size" ]; then
              echo "SIZE-FAIL $name: $actual != $size"
              exit 1
            fi
            if [ "$digest" != "none" ]; then
              want="${digest#sha256:}"
              got=$(sha256sum "dl/$name" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "HASH-FAIL $name"
                exit 1
              fi
            fi
            gh release upload "$DST" "dl/$name" --repo "$OWNER/$REPO" --clobber
            rm -f "dl/$name"
            echo "OK $name"
          done < assets.tsv
          echo "MIRROR DONE: $REPO -> $DST"
