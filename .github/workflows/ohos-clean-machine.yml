name: ohos-clean-machine-ga

# Full clean-machine GA gate. This job needs an OpenHarmony host with the
# OpenHarmony SDK/toolchain (and optionally a connected device); it cannot run
# on a GitHub-hosted Linux runner. The offline test-clean-machine-plan.sh in
# ohos-install-tests validates the script's plan on ubuntu-latest.
#
# Register a self-hosted runner with the labels
# [self-hosted, openharmony, ohos-arm64], then run this workflow manually for a
# release candidate. It installs the
# published SDK tarball + workload 1.0.0 into an isolated HOME/INSTALL_DIR and
# runs 826, JIT publish and the AOT fetch/publish flow. Device checks are
# enabled by setting skip_device=false and providing OHOS_HDC / OHOS_UDID.
on:
  workflow_dispatch:
    inputs:
      skip_device:
        description: "Skip HDC install/start checks"
        type: choice
        options: ["true", "false"]
        default: "true"
      cold_nuget:
        description: "Use a cold NuGet package cache (needs reliable network)"
        type: choice
        options: ["false", "true"]
        default: "false"
      sdk_tarball:
        description: "Optional local SDK tarball path (default: published release URL)"
        required: false
        default: ""
      workload_bundle:
        description: "Optional local workload bundle path (default: published release URL)"
        required: false
        default: ""
      sdk_ref:
        description: "sdk-ohos ref to validate (remote mode; unused for local sources)"
        required: false
        default: ""
      sdk_source:
        description: "Local sdk-ohos checkout on the runner"
        required: false
        default: "/data/storage/el2/base/tmp/opencode/sdk-clean-gate"
      workload_source:
        description: "Local ohos-workload checkout on the runner"
        required: false
        default: "/storage/Users/currentUser/springsources/ohos-workload"
      skip_826:
        description: "Skip the 826 harness"
        type: choice
        options: ["false", "true"]
        default: "false"
      skip_jit:
        description: "Skip the JIT publish"
        type: choice
        options: ["false", "true"]
        default: "false"
      skip_aot:
        description: "Skip the AOT publish"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: read

jobs:
  clean-machine:
    runs-on: [self-hosted, openharmony, ohos-arm64]
    timeout-minutes: 180
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSBUILDDISABLENODEREUSE: "1"
      ALLOW_BUSY: "1"
    steps:
      - name: Check out sdk-ohos
        env:
          SDK_SOURCE: ${{ inputs.sdk_source }}
        run: |
          set -eux
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* 2>/dev/null || true
          git clone --no-hardlinks --local "$SDK_SOURCE" "$GITHUB_WORKSPACE"

      - name: Check out ohos-workload
        env:
          WORKLOAD_SOURCE: ${{ inputs.workload_source }}
        run: |
          set -eux
          rm -rf "$GITHUB_WORKSPACE/ohos-workload"
          git clone --no-hardlinks --local "$WORKLOAD_SOURCE" "$GITHUB_WORKSPACE/ohos-workload"

      - name: Prepare clean root
        run: rm -rf "${{ runner.workspace }}/ohos-clean-ga"

      - name: Run the clean-machine GA gate
        timeout-minutes: 120
        env:
          CLEAN_ROOT: ${{ runner.workspace }}/ohos-clean-ga
          OHOS_WORKLOAD_DIR: ${{ github.workspace }}/ohos-workload
          SDK_TARBALL: ${{ inputs.sdk_tarball }}
          WORKLOAD_BUNDLE: ${{ inputs.workload_bundle }}
          SKIP_DEVICE: ${{ inputs.skip_device }}
          SKIP_826: ${{ inputs.skip_826 }}
          SKIP_JIT: ${{ inputs.skip_jit }}
          SKIP_AOT: ${{ inputs.skip_aot }}
          COLD_NUGET: ${{ inputs.cold_nuget }}
          HDC: ${{ secrets.OHOS_HDC }}
          UDID: ${{ secrets.OHOS_UDID }}
        run: |
          sh eng/ohos-install/tests/clean-machine-ga.sh

      - name: Show clean-machine logs
        if: always()
        run: |
          log_dir="${{ runner.workspace }}/ohos-clean-ga/logs"
          echo "clean-machine logs: $log_dir"
          ls -l "$log_dir" || true
